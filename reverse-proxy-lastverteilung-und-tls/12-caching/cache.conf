# Caching im Reverse Proxy (nginx): Zone, Gültigkeit aus dem Backend (Cache-Control), Bypass, veraltete Antworten bei Ausfall
proxy_cache_path /tmp/p11-nginx/cache levels=1:2 keys_zone=lab:1m inactive=60s max_size=10m;
upstream b1 { server 10.1.2.11:8080; }

server {
    listen 80;
    server_name shop.lab.test;
    add_header X-Cache-Status $upstream_cache_status always;

    # mit Cache; die Gültigkeit kommt vom Backend (Cache-Control: max-age=10)
    location = /cache {
        proxy_pass http://b1;
        proxy_cache lab;
        proxy_cache_valid 200 3s;                 # nur Rückfall, wenn das Backend keine Angabe macht
        proxy_cache_lock on;                      # gleichzeitige Anfragen warten auf die erste
        proxy_cache_bypass $http_x_refresh;       # Header X-Refresh: 1 umgeht das Lesen aus dem Cache
        proxy_cache_use_stale error timeout http_502 http_503 updating;
    }

    # derselbe Pfad ohne Cache: jede Anfrage geht ans Backend
    location = /roh {
        proxy_pass http://b1/cache;
    }
}
