server {
    listen 80;
    server_name api.lab.test;
    location /.well-known/acme-challenge/ { root /tmp/p11-webroot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.lab.test;
    ssl_certificate     /tmp/p11-le/conf/live/api.lab.test/fullchain.pem;
    ssl_certificate_key /tmp/p11-le/conf/live/api.lab.test/privkey.pem;
    location / {
        proxy_pass http://10.1.2.12:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
