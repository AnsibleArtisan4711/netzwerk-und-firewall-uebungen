# TLS-Terminierung mit nginx: HTTPS am Proxy, HTTP zum Backend; Weiterleitung 80 -> 443; HSTS
upstream web { server 10.1.2.11:8080; server 10.1.2.12:8080; }

server {
    listen 80;
    server_name shop.lab.test api.lab.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;      # nginx ab 1.25.1: listen 443 ssl; http2 on;
    server_name shop.lab.test api.lab.test;

    ssl_certificate     /tmp/p11-ca/server.crt;
    ssl_certificate_key /tmp/p11-ca/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
