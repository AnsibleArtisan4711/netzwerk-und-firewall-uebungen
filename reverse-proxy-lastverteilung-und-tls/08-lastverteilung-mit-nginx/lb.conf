# Lastverteilung mit nginx: ein Upstream je Verfahren
upstream rr      { server 10.1.2.11:8080; server 10.1.2.12:8080; }                          # Round Robin (Standard)
upstream gewicht { server 10.1.2.11:8080 weight=3; server 10.1.2.12:8080; }                  # 3:1
upstream lc      { least_conn; server 10.1.2.11:8080; server 10.1.2.12:8080; }               # wenigste aktive Verbindungen
upstream hash    { ip_hash; server 10.1.2.11:8080; server 10.1.2.12:8080; }                  # gleiche Client-Adresse, gleiches Backend
upstream passiv  { server 10.1.2.11:8080; server 10.1.2.12:8080 max_fails=2 fail_timeout=5s; }   # passive Gesundheitsprüfung

server {
    listen 80;
    server_name shop.lab.test;
    proxy_connect_timeout 1s;
    location /rr/      { proxy_pass http://rr/; }
    location /gewicht/ { proxy_pass http://gewicht/; }
    location /lc/      { proxy_pass http://lc/; }
    location /hash/    { proxy_pass http://hash/; }
    location /passiv/  { proxy_pass http://passiv/; }
}
