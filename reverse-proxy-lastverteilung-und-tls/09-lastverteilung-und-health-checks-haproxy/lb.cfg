# Lastverteilung und aktive Gesundheitsprüfung mit HAProxy
global
    stats socket /tmp/p11-haproxy.sock mode 600 level admin
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 1s
    timeout client  10s
    timeout server  10s
    option httpchk GET /health            # aktive Prüfung: jede Sekunde /health abfragen
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 # 2 Fehlschläge = DOWN, 2 Erfolge = wieder UP

frontend web
    bind :80
    use_backend rr       if { path_beg /rr/ }
    use_backend gewicht  if { path_beg /gewicht/ }
    use_backend lc       if { path_beg /lc/ }
    use_backend quelle   if { path_beg /quelle/ }
    use_backend sticky   if { path_beg /sticky/ }
    use_backend mitbackup if { path_beg /backup/ }

backend rr
    http-request set-path %[path,regsub(^/[a-z]+/,/)]     # Präfix entfernen
    balance roundrobin
    server b1 10.1.2.11:8080 check
    server b2 10.1.2.12:8080 check

backend gewicht
    http-request set-path %[path,regsub(^/[a-z]+/,/)]     # Präfix entfernen
    balance roundrobin
    server b1 10.1.2.11:8080 check weight 3
    server b2 10.1.2.12:8080 check weight 1

backend lc
    http-request set-path %[path,regsub(^/[a-z]+/,/)]     # Präfix entfernen
    balance leastconn
    server b1 10.1.2.11:8080 check
    server b2 10.1.2.12:8080 check

backend quelle
    http-request set-path %[path,regsub(^/[a-z]+/,/)]     # Präfix entfernen
    balance source
    server b1 10.1.2.11:8080 check
    server b2 10.1.2.12:8080 check

backend sticky
    http-request set-path %[path,regsub(^/[a-z]+/,/)]     # Präfix entfernen
    balance roundrobin
    cookie SRV insert indirect nocache
    server b1 10.1.2.11:8080 check cookie s1
    server b2 10.1.2.12:8080 check cookie s2

backend mitbackup
    http-request set-path %[path,regsub(^/[a-z]+/,/)]     # Präfix entfernen
    balance roundrobin
    server b1 10.1.2.11:8080 check
    server b2 10.1.2.12:8080 check backup
