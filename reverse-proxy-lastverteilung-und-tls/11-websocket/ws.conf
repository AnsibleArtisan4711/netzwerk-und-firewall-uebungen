# WebSocket über nginx: ohne und mit Upgrade-Header, kurze und lange Leerlaufzeit
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream b1 { server 10.1.2.11:8080; }

server {
    listen 80;
    server_name shop.lab.test;

    # a) wie ein normaler HTTP-Proxy: Upgrade und Connection sind „hop-by-hop“ und werden nicht weitergegeben
    location /ohne { proxy_pass http://b1/ws; }

    # b) richtig, aber mit kurzer Leerlaufzeit (Standard von nginx: 60 s)
    location /kurz {
        proxy_pass http://b1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3s;
    }

    # c) richtig, mit langer Leerlaufzeit
    location /lang {
        proxy_pass http://b1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
