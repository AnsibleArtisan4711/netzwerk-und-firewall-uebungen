# WebSocket über HAProxy: der Upgrade wird erkannt; für die Leerlaufzeit nach dem Upgrade gilt „timeout tunnel“
global
    stats socket /tmp/p11-haproxy.sock mode 600 level admin
    log stdout format raw local0
defaults
    mode http
    log global
    timeout connect 1s
    timeout client  10s
    timeout server  10s

frontend ws
    bind :8000
    use_backend kurz if { path_beg /kurz }
    default_backend lang

backend kurz
    timeout tunnel 3s
    http-request set-path /ws
    server b1 10.1.2.11:8080

backend lang
    timeout tunnel 60s
    http-request set-path /ws
    server b1 10.1.2.11:8080
