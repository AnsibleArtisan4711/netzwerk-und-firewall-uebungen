# Absichtlich eingebaute Fehler- und Schutzfälle für die Fehlersuche
limit_req_zone $binary_remote_addr zone=z:1m rate=2r/s;
upstream b1 { server 10.1.2.11:8080; }

server {                                   # alles mit unbekanntem Host-Namen wird ohne Antwort beendet
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name shop.lab.test;
    server_tokens off;
    proxy_connect_timeout 1s;

    location /ok       { proxy_pass http://b1/; }
    location /abgelehnt { proxy_pass http://10.1.2.12:9999/; }            # Port ohne Dienst: 502
    location /tot      { proxy_pass http://10.1.2.99:8080/; }              # Adresse ohne Host: 504 nach connect-timeout
    location /langsam  { proxy_pass http://b1/slow; proxy_read_timeout 2s; }   # Backend antwortet zu spät: 504
    location /upload   { client_max_body_size 1k; proxy_pass http://b1/; } # Anfrage zu groß: 413
    location /limit    { limit_req zone=z burst=2 nodelay; limit_req_status 429; proxy_pass http://b1/; }
}
