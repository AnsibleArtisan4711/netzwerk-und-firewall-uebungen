global
    stats socket /tmp/p11-haproxy.sock mode 600 level admin
    log stdout format raw local0
defaults
    mode http
    log global
    timeout connect 1s
    timeout client  10s
    timeout server  2s
    option httpchk GET /health
    default-server inter 1s fall 2 rise 2
frontend web
    bind :8000
    default_backend alle
backend alle
    server b1 10.1.2.11:8080 check
    server b2 10.1.2.12:8080 check
