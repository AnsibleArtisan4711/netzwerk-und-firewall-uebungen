# Musterlösung Abschlussprojekt: HTTPS-Reverse-Proxy mit Lastverteilung, Schutz und gehärteten Headern (nginx)
limit_req_zone $binary_remote_addr zone=schutz:1m rate=5r/s;

upstream shop {
    server 10.1.2.11:8080 max_fails=2 fail_timeout=5s;
    server 10.1.2.12:8080 max_fails=2 fail_timeout=5s;
}

server {                                   # unbekannte Namen: keine Antwort
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /tmp/p11-ca/server.crt;
    ssl_certificate_key /tmp/p11-ca/server.key;
    return 444;
}

server {
    listen 80;
    server_name shop.lab.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.lab.test;
    server_tokens off;

    ssl_certificate     /tmp/p11-ca/server.crt;
    ssl_certificate_key /tmp/p11-ca/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    client_max_body_size 1m;

    location / {
        limit_req zone=schutz burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://shop;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Backend;
    }
}
