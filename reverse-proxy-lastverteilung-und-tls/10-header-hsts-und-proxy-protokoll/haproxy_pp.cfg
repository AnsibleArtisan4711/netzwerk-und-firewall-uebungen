global
    stats socket /tmp/p11-haproxy.sock mode 600 level admin
    log stdout format raw local0
defaults
    mode http
    log global
    timeout connect 1s
    timeout client 10s
    timeout server 10s

frontend mit_proxy_protokoll
    bind :8000
    default_backend nginx_pp
frontend ohne_proxy_protokoll
    bind :8001
    default_backend nginx_plain

backend nginx_pp
    server n 127.0.0.1:8081 send-proxy          # sendet den PROXY-Kopf (Version 1)
backend nginx_plain
    server n 127.0.0.1:8081                      # kein PROXY-Kopf: nginx erwartet ihn aber
