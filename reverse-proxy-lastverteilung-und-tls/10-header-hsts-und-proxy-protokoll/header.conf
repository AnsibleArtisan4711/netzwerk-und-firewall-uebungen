upstream b1 { server 10.1.2.11:8080; }

# a) naiv: hängt die Client-Adresse an eine vom Client gelieferte Kette an
server {
    listen 80;
    server_name shop.lab.test;
    location / {
        proxy_pass http://b1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# b) gehärtet: Edge-Proxy überschreibt die Kette mit der echten Adresse, setzt Sicherheits-Header, versteckt Details
server {
    listen 81;
    server_name shop.lab.test;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    location / {
        proxy_pass http://b1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Backend;
    }
}

# c) hinter HAProxy mit PROXY-Protokoll: die echte Client-Adresse kommt aus dem PROXY-Kopf, nicht aus HTTP
server {
    listen 127.0.0.1:8081 proxy_protocol;
    server_name shop.lab.test;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    location / {
        proxy_pass http://b1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
