# nginx als Reverse Proxy: Header, Pfade, Zeitlimits, zwei virtuelle Server
upstream b1 { server 10.1.2.11:8080; }
upstream b2 { server 10.1.2.12:8080; }

# gemeinsame Proxy-Header als Snippet in einer Variablen-Datei wäre üblich (include proxy_params);
# hier der Klarheit halber direkt in den Locations.
server {
    listen 80;
    server_name shop.lab.test;

    # a) ohne eigene Header: das Backend sieht Host=b1 (der Name des Upstreams) und die Proxy-Adresse
    location = /roh {
        proxy_pass http://b1/;
    }

    # b) mit Headern: Host, echte Client-Adresse, Protokoll
    location / {
        proxy_pass http://b1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # c) Pfad: mit abschließendem Schrägstrich in proxy_pass wird das Präfix /api/ abgeschnitten
    location /api/ {
        proxy_pass http://b2/;
        proxy_set_header Host $host;
    }

    # d) ohne Schrägstrich bleibt der volle Pfad erhalten
    location /voll/ {
        proxy_pass http://b2;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name api.lab.test;
    location / {
        proxy_pass http://b2;
        proxy_set_header Host $host;
    }
}
