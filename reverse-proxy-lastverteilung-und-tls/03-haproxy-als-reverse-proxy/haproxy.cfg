# HAProxy als Reverse Proxy: Weiterleitung nach Host und Pfad
global
    stats socket /tmp/p11-haproxy.sock mode 600 level admin
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    timeout connect 2s
    timeout client  10s
    timeout server  10s
    log global

frontend web
    bind :80
    option httplog
    http-request set-header X-Forwarded-Proto http
    acl ist_api  hdr(host) -i api.lab.test
    acl pfad_api path_beg /api/
    use_backend b2_dienst if ist_api
    use_backend b2_dienst if pfad_api
    default_backend b1_dienst

backend b1_dienst
    option forwardfor                      # setzt X-Forwarded-For
    server b1 10.1.2.11:8080

backend b2_dienst
    option forwardfor
    http-request set-path %[path,regsub(^/api/,/)]     # Präfix /api/ entfernen
    server b2 10.1.2.12:8080

# einfacher TCP-Durchreicher (Schicht 4): Port 9000 -> b1
frontend roh
    mode tcp
    bind :9000
    default_backend b1_roh

backend b1_roh
    mode tcp
    server b1 10.1.2.11:8080
