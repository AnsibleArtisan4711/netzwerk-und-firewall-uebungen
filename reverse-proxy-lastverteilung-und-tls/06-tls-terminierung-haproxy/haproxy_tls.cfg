# TLS-Terminierung mit HAProxy: zwei Zertifikate (SNI), HTTP/2, Weiterleitung auf HTTPS, HSTS; dazu TLS-Durchleitung (Passthrough)
global
    stats socket /tmp/p11-haproxy.sock mode 600 level admin
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    timeout connect 2s
    timeout client  10s
    timeout server  10s

frontend web
    bind :80
    bind :443 ssl crt /tmp/p11-ca/shop.lab.test.pem crt /tmp/p11-ca/api.lab.test.pem alpn h2,http/1.1
    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000"
    use_backend b2_dienst if { ssl_fc_sni -i api.lab.test }
    default_backend b1_dienst

backend b1_dienst
    option forwardfor
    server b1 10.1.2.11:8080

backend b2_dienst
    option forwardfor
    server b2 10.1.2.12:8080

# Passthrough: HAProxy liest nur den Servernamen (SNI) und reicht die verschlüsselten Bytes durch
frontend durch
    mode tcp
    bind :8443
    tcp-request inspect-delay 2s
    tcp-request content accept if { req_ssl_hello_type 1 }
    default_backend tls_server

backend tls_server
    mode tcp
    server s 127.0.0.1:4443
