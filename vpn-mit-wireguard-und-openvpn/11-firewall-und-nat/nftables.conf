#!/usr/sbin/nft -f
# Modul 11, Aufgaben 2 und 3: Regelwerk fuer VM 1 (vpn-a). Syntax mit nft -c (nftables 1.0.9, Ubuntu 24.04) geprueft und geladen.
# Stand: nicht auf Debian 12 getestet.
flush ruleset
table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        icmp type echo-request accept
        tcp dport 22 accept
        udp dport { 51820, 1194 } accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname { "wg0", "tun0" } oifname "veth-gw" accept
    }
}
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr { 10.8.0.0/24, 10.9.0.0/24 } oifname "veth-gw" masquerade
    }
}
